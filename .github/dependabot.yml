version: 2

updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "09:00"
          timezone: "America/Chicago"
      cooldown:
          default-days: 7
          semver-major-days: 14
          semver-minor-days: 7
          semver-patch-days: 3
      open-pull-requests-limit: 5
      labels:
          - "dependencies"
          - "javascript"
      commit-message:
          prefix: "chore(deps)"
      groups:
          security-updates:
              applies-to: "security-updates"
              patterns:
                  - "*"
          minor-and-patch-updates:
              applies-to: "version-updates"
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"
